<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexora</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 20%,#262039,#101114 62%);color:#eef0f4;font:15px/1.5 "Segoe UI",system-ui}.card{text-align:center;width:min(500px,90vw);padding:36px;border:1px solid #30343d;border-radius:22px;background:#181a1f;box-shadow:0 22px 80px #0006}.mark{width:58px;height:58px;margin-bottom:16px}.brand{font-size:28px;font-weight:720}.sub{color:#a1a6b0;margin:10px 0 26px}.spinner{width:22px;height:22px;border:2px solid #404455;border-top-color:#a78bfa;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 10px}.status{font-size:12px;color:#a1a6b0;min-height:36px}.status.error{color:#f87171}.foot{font-size:10px;color:#737987;margin-top:22px}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><main class="card"><img class="mark" src="../frontend/assets/nexora.svg"><div class="brand">Nexora</div><div class="sub">Your private local AI workspace</div><div class="spinner" id="spin"></div><div class="status" id="status">Starting local services…</div><div class="foot">Local-first · powered by your Ollama installation</div></main><script>window.setStatus=(t,e=false)=>{document.getElementById('status').textContent=t;document.getElementById('status').classList.toggle('error',e);if(e)document.getElementById('spin').style.display='none'}</script></body></html>
